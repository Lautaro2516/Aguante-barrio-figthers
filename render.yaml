services:
  - type: web
    name: aguante-barrio-fighters
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false
